[package]
name = "vecrow-integration-tests"
description = "near-workspaces sandbox tests for the Vecrow escrow contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dev-dependencies]
anyhow.workspace = true
# Same versions as near-workspaces uses, to sign and send NEP-366 meta
# transactions, which near-workspaces has no builder for.
near-crypto = "0.38"
near-jsonrpc-client = "0.23"
near-primitives = "0.38"
near-workspaces.workspace = true
serde_json.workspace = true
tokio.workspace = true
wallet-fixtures = { path = "../wallet-fixtures" }
