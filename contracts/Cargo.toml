[workspace]
resolver = "3"
members = ["escrow", "mock-ft", "wallet-fixtures", "integration-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
near-workspaces = "0.24.0"
borsh = { version = "1.5", features = ["derive"] }
bs58 = "0.5"
base64 = "0.22"
ed25519-dalek = "2.2"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = "0.10"
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Arithmetic on balances must never wrap silently.
overflow-checks = true
